<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SistemaVisitas.Client</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="SistemaVisitas.Client.styles.css" rel="stylesheet" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="SistemaVisitas.Client.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- PANTALLA DE CARGA INICIAL (BOOTSTRAP STRAPPED) -->
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
            <svg width="60" height="60" viewBox="0 0 50 50" style="animation: spin 1s linear infinite; margin-bottom: 15px;">
                <circle cx="25" cy="25" r="20" fill="none" stroke="#e0e0e0" stroke-width="5"></circle>
                <circle cx="25" cy="25" r="20" fill="none" stroke="#0d6efd" stroke-width="5" stroke-dasharray="31.4 100" stroke-linecap="round"></circle>
            </svg>
            <h5 style="color: #6c757d; font-weight: 600; margin: 0;">Iniciando Sistema...</h5>
            <style>
                @keyframes spin {
                    100% {
                        transform: rotate(360deg);
                    }
                }
            </style>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <!-- SCRIPT PARA EL LIENZO DE FIRMA -->
    <script>
                window.signaturePad = {
                    init: function (canvasId) {
                        var canvas = document.getElementById(canvasId);
                        if (!canvas) return;
                        var ctx = canvas.getContext("2d");
                        ctx.lineWidth = 2;
                        ctx.lineCap = "round";
                        ctx.strokeStyle = "#000000";

                        var drawing = false;
                        var lastPos = { x: 0, y: 0 };

                        function getPos(e) {
                            var rect = canvas.getBoundingClientRect();
                            // Soporte para táctil y mouse
                            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
                            var clientY = e.touches ? e.touches[0].clientY : e.clientY;
                            return { x: clientX - rect.left, y: clientY - rect.top };
                        }

                        function startDraw(e) {
                            if(e.type === "touchstart") e.preventDefault(); // Evita que la pantalla haga scroll al firmar
                            drawing = true;
                            lastPos = getPos(e);
                        }

                        function draw(e) {
                            if (!drawing) return;
                            if(e.type === "touchmove") e.preventDefault();
                            var mousePos = getPos(e);
                            ctx.beginPath();
                            ctx.moveTo(lastPos.x, lastPos.y);
                            ctx.lineTo(mousePos.x, mousePos.y);
                            ctx.stroke();
                            lastPos = mousePos;
                        }

                        function stopDraw(e) { drawing = false; }

                        canvas.addEventListener("mousedown", startDraw, false);
                        canvas.addEventListener("mousemove", draw, false);
                        canvas.addEventListener("mouseup", stopDraw, false);

                        canvas.addEventListener("touchstart", startDraw, {passive: false});
                        canvas.addEventListener("touchmove", draw, {passive: false});
                        canvas.addEventListener("touchend", stopDraw, false);
                    },
                    getData: function (canvasId) {
                        var canvas = document.getElementById(canvasId);
                        // Devuelve la imagen en formato Base64
                        return canvas ? canvas.toDataURL("image/png") : "";
                    },
                    clear: function (canvasId) {
                        var canvas = document.getElementById(canvasId);
                        if (canvas) {
                            var ctx = canvas.getContext("2d");
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                        }
                    }
                };
    </script>
</body>

</html>
